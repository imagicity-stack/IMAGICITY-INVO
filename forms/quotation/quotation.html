<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>

  <div class="app">
    <header class="topbar no-print">
      <div class="brandMark">
        <div class="brandDot"></div>
        <div>
          <div class="brandName">IMAGICITY</div>
          <div class="brandTag">Quotation Preview Template</div>
        </div>
      </div>
    </header>

    <main class="stage">
      <section class="paperWrap">
        <div class="paper" id="quoteRoot">
          <div class="paperInner">

            <div class="paperHeader avoid-break">
              <div class="company">
                <div class="logoBox">
                  <div class="logoGlyph">
                    <span class="logoGlyphInner"></span>
                  </div>
                  <div class="companyText">
                    <div class="companyName" id="companyName"></div>
                    <div class="companyMeta" id="companyMeta"></div>
                  </div>
                </div>
              </div>

              <div class="docMeta">
                <div class="docTitle">QUOTATION</div>
                <div class="metaGrid">
                  <div class="metaItem">
                    <div class="metaLabel">Quotation No.</div>
                    <div class="metaValue mono" id="quoteNumber"></div>
                  </div>
                  <div class="metaItem">
                    <div class="metaLabel">Issue Date</div>
                    <div class="metaValue" id="issueDate"></div>
                  </div>
                  <div class="metaItem">
                    <div class="metaLabel">Valid Until</div>
                    <div class="metaValue" id="validUntil"></div>
                  </div>
                  <div class="metaItem">
                    <div class="metaLabel">Currency</div>
                    <div class="metaValue" id="currency"></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="divider"></div>

            <div class="clientBlock avoid-break">
              <div class="card">
                <div class="cardTitle">Bill To</div>
                <div class="clientName" id="clientName"></div>
                <div class="muted" id="clientBrand"></div>
                <div class="addr" id="clientAddress"></div>

                <div class="pillRow">
                  <span class="pill" id="gstRegisteredPill"></span>
                  <span class="pill pill-soft" id="stateCodePill"></span>
                </div>

                <div class="kvRow">
                  <div class="kv">
                    <div class="kvLabel">Email</div>
                    <div class="kvValue" id="clientEmail"></div>
                  </div>
                  <div class="kv">
                    <div class="kvLabel">Phone</div>
                    <div class="kvValue" id="clientPhone"></div>
                  </div>
                </div>

                <div class="kvRow">
                  <div class="kv">
                    <div class="kvLabel">GSTIN</div>
                    <div class="kvValue mono" id="clientGstin"></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="tableWrap">
              <table class="itemsTable">
                <thead>
                  <tr>
                    <th class="col-sno">#</th>
                    <th>Description</th>
                    <th class="col-unit">Unit</th>
                    <th class="col-qty">Qty</th>
                    <th class="col-rate">Rate</th>
                    <th class="col-tax">GST</th>
                    <th class="col-amt">Amount</th>
                  </tr>
                </thead>
                <tbody id="itemsBody"></tbody>
              </table>
            </div>

            <div class="summaryRow avoid-break">
              <div></div>
              <div class="card card-accent">
                <div class="cardTitle">Summary</div>

                <div class="sumLine">
                  <span class="muted">Subtotal</span>
                  <span class="mono" id="subTotal"></span>
                </div>

                <div class="sumLine" id="discountLine">
                  <span class="muted" id="discountLabel"></span>
                  <span class="mono" id="discountValue"></span>
                </div>

                <div class="sumLine">
                  <span class="muted">Tax</span>
                  <span class="mono" id="taxTotal"></span>
                </div>

                <div class="divider soft"></div>

                <div class="grand">
                  <div class="grandLabel">Grand Total</div>
                  <div class="grandValue mono" id="grandTotal"></div>
                </div>

                <div class="amountWords" id="amountWords"></div>
              </div>
            </div>

            <div class="notesGrid">
              <div class="noteCard avoid-break">
                <div class="noteTitle">Notes</div>
                <div class="noteText" id="notes"></div>
              </div>

              <div class="noteCard avoid-break">
                <div class="noteTitle">Terms</div>
                <ul class="termsList" id="terms"></ul>
              </div>
            </div>

            <div class="paperFooter avoid-break">
              <div class="signBlock">
                <div class="signFor">For <span id="signCompany"></span></div>
                <div class="signLine"></div>
                <div class="signMeta">Authorized Signatory</div>
              </div>

              <div class="footerMeta">
                <div class="footerLine">This is a system generated quotation.</div>
                <div class="footerLine muted" id="footerContact"></div>
              </div>
            </div>

          </div>
          <div class="footerBar"></div>
        </div>
      </section>
    </main>
  </div>
